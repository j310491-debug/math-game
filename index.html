<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小當家超市：金錢與購物挑戰</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: #e0f7fa; margin: 0; padding: 10px;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100dvh; box-sizing: border-box; user-select: none;
        }

        #app-container {
            width: 100%; max-width: 1100px; display: flex; gap: 15px;
            flex-wrap: wrap; justify-content: center;
        }

        /* 左側遊戲主區塊 */
        #game-area {
            flex: 1 1 650px; background-color: #ffffff; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .mode-switch {
            display: flex; gap: 10px; margin-bottom: 20px; width: 100%; justify-content: center;
        }
        .mode-btn {
            padding: 12px 25px; font-size: 1.5rem; font-weight: bold; border-radius: 12px;
            border: 3px solid #b0bec5; background-color: #eceff1; cursor: pointer; color: #546e7a;
        }
        .mode-btn.active { background-color: #4fc3f7; border-color: #0288d1; color: white; }

        .question-title { font-size: 1.8rem; font-weight: bold; color: #37474f; margin-bottom: 15px; text-align: center; }

        /* ================= 模式一：認識錢幣 ================= */
        #money-display {
            width: 250px; height: 160px; display: flex; justify-content: center; align-items: center;
            background-color: #fff8e1; border: 4px dashed #ffc107; border-radius: 15px; margin-bottom: 20px; padding: 10px;
        }
        .money-img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); }
        
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; }
        .opt-btn {
            padding: 15px; font-size: 1.8rem; font-weight: bold; border-radius: 12px;
            border: 3px solid #81c784; background-color: #e8f5e9; color: #2e7d32; cursor: pointer;
        }
        .opt-btn:active { background-color: #c8e6c9; }

        /* ================= 模式二：視覺化算式面板 ================= */
        #shopping-display { display: none; flex-direction: column; width: 100%; align-items: center; gap: 15px; }
        
        .equation-board {
            display: flex; width: 100%; justify-content: space-between; align-items: center;
            background-color: #f5f5f5; border-radius: 15px; padding: 15px; box-sizing: border-box; gap: 10px;
        }

        .eq-box {
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            border-radius: 15px; padding: 15px; flex: 1; height: 220px; box-sizing: border-box; text-align: center;
        }
        .box-title { font-size: 1.4rem; font-weight: bold; padding: 5px 10px; border-radius: 20px; margin-bottom: 10px; color: white; width: 100%; box-sizing: border-box;}
        
        /* 1. 給老闆的錢 */
        .eq-pay { background-color: #e3f2fd; border: 4px solid #90caf9; }
        .eq-pay .box-title { background-color: #1976d2; }
        .pay-img { height: 75px; max-width: 120px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); margin: auto 0;}
        .pay-text { font-size: 1.5rem; font-weight: bold; color: #1565c0; margin-top: 10px;}

        /* 2. & 4. 運算符號 */
        .eq-sign { font-size: 3rem; font-weight: bold; color: #546e7a; display: flex; align-items: center; justify-content: center; width: 40px; }

        /* 3. 商品價格 (扣除) */
        .eq-item { background-color: #fce4ec; border: 4px solid #f48fb1; }
        .eq-item .box-title { background-color: #d81b60; }
        .item-emoji { font-size: 4.5rem; margin: auto 0; }
        .item-price-tag { background-color: #c2185b; color: white; padding: 5px 12px; border-radius: 8px; font-size: 1.4rem; font-weight: bold; margin-top: 10px; }

        /* 5. 找零 (答案) */
        .eq-change { background-color: #f1f8e9; border: 4px dashed #81c784; }
        .eq-change .box-title { background-color: #388e3c; }
        #answer-input {
            width: 100%; max-width: 120px; font-size: 2.5rem; text-align: center; font-weight: bold;
            padding: 10px; border: 4px solid #4caf50; border-radius: 12px; color: #2e7d32; margin: auto 0; box-sizing: border-box;
        }
        #submit-btn {
            width: 100%; padding: 12px 0; font-size: 1.5rem; font-weight: bold;
            background-color: #4caf50; color: white; border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 0 #388e3c; margin-top: 10px;
        }
        #submit-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #388e3c; }

        /* 算式文字雙重提示 */
        .formula-hint {
            background-color: #fff9c4; color: #f57f17; padding: 8px 25px;
            border-radius: 12px; font-size: 1.8rem; font-weight: bold;
            border: 3px dashed #fbc02d; text-align: center; width: 100%; box-sizing: border-box;
        }

        /* ================= 右側計算機區塊 ================= */
        #calc-area {
            flex: 0 0 300px; background-color: #37474f; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 20px; box-sizing: border-box;
        }
        .calc-title { color: white; text-align: center; font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; }
        #calc-screen {
            width: 100%; height: 60px; background-color: #cfd8dc; border-radius: 10px;
            font-size: 2.5rem; text-align: right; padding: 10px; box-sizing: border-box;
            font-family: monospace; border: none; margin-bottom: 15px; color: #263238; font-weight: bold;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn {
            padding: 15px 0; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 8px;
            background-color: #eceff1; cursor: pointer; color: #37474f; box-shadow: 0 4px 0 #b0bec5;
        }
        .calc-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b0bec5; }
        .calc-btn.op { background-color: #ffb74d; color: #e65100; box-shadow: 0 4px 0 #ff9800; }
        .calc-btn.op:active { box-shadow: 0 0 0 #ff9800; }
        .calc-btn.clear { background-color: #ef5350; color: white; box-shadow: 0 4px 0 #e53935; }
        .calc-btn.clear:active { box-shadow: 0 0 0 #e53935; }
        .calc-btn.zero { grid-column: span 2; }

        /* 回饋動畫 */
        .shake { animation: shake 0.4s; border-color: #f44336 !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
        
        #feedback-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center; flex-direction: column;
            z-index: 100; font-size: 6rem; background-color: rgba(255,255,255,0.95);
            font-weight: bold; color: #4caf50; border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 遊戲主區塊 -->
        <div id="game-area">
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-mode1" onclick="switchMode(1)">1. 認識錢幣</button>
                <button class="mode-btn" id="btn-mode2" onclick="switchMode(2)">2. 購物找零</button>
            </div>

            <!-- 模式一：認識錢幣 -->
            <div id="mode1-container" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="question-title">讀一讀，看一看，這是多少錢？</div>
                <div id="money-display"></div>
                <div class="options-grid" id="options-area"></div>
            </div>

            <!-- 模式二：視覺化算式面板 -->
            <div id="shopping-display">
                
                <div class="equation-board">
                    <!-- 1. 被減數 (給老闆的錢) -->
                    <div class="eq-box eq-pay">
                        <div class="box-title">給老闆的錢</div>
                        <img src="" id="shop-pay-img" class="pay-img">
                        <div class="pay-text" id="shop-pay-text">50 元</div>
                    </div>

                    <!-- 2. 減號 -->
                    <div class="eq-sign">➖</div>

                    <!-- 3. 減數 (商品價格) -->
                    <div class="eq-box eq-item">
                        <div class="box-title">買商品的錢</div>
                        <div class="item-emoji" id="shop-item-icon">🍎</div>
                        <div class="item-price-tag">扣掉 <span id="shop-item-price">35</span> 元</div>
                    </div>

                    <!-- 4. 等號 -->
                    <div class="eq-sign">🟰</div>

                    <!-- 5. 差 (找零) -->
                    <div class="eq-box eq-change">
                        <div class="box-title">找回的零錢</div>
                        <input type="number" id="answer-input" placeholder="?" min="0">
                        <button id="submit-btn" onclick="checkShoppingAnswer()">確定</button>
                    </div>
                </div>

                <!-- 算式文字雙重提示 -->
                <div id="formula-hint" class="formula-hint">💡 算式小提示：50 - 35 = ?</div>
            </div>

            <div id="feedback-overlay"></div>
        </div>

        <!-- 輔助計算機區塊 -->
        <div id="calc-area">
            <div class="calc-title">📝 輔助小計算機</div>
            <input type="text" id="calc-screen" value="0" readonly>
            <div class="calc-grid">
                <button class="calc-btn clear" onclick="calcInput('C')">C</button>
                <button class="calc-btn op" onclick="calcInput('(')">(</button>
                <button class="calc-btn op" onclick="calcInput(')')">)</button>
                <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn op" onclick="calcInput('*')">×</button>
                
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn op" onclick="calcInput('-')">-</button>
                
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                <button class="calc-btn op" onclick="calcInput('+')">+</button>
                
                <button class="calc-btn zero" onclick="calcInput('0')">0</button>
                <button class="calc-btn" onclick="calcInput('.')">.</button>
                <button class="calc-btn op" onclick="calcInput('=')">=</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 內嵌式錢幣影像資料庫 (Base64 SVG Data)
        // ==========================================
        const svg1 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23e0e0e0' stroke='%239e9e9e' stroke-width='4'/><text x='50' y='65' font-size='40' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23424242'>1</text></svg>";
        const svg5 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23e0e0e0' stroke='%239e9e9e' stroke-width='4'/><text x='50' y='65' font-size='40' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23424242'>5</text></svg>";
        const svg10 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23e0e0e0' stroke='%239e9e9e' stroke-width='4'/><text x='50' y='65' font-size='40' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23424242'>10</text></svg>";
        const svg50 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffca28' stroke='%23ff8f00' stroke-width='4'/><text x='50' y='65' font-size='40' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e65100'>50</text></svg>";
        const svg100 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><rect x='5' y='5' width='190' height='90' rx='10' fill='%23ffcdd2' stroke='%23e53935' stroke-width='4'/><text x='100' y='65' font-size='45' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23c62828'>100</text></svg>";
        const svg500 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><rect x='5' y='5' width='190' height='90' rx='10' fill='%23d7ccc8' stroke='%23795548' stroke-width='4'/><text x='100' y='65' font-size='45' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%235d4037'>500</text></svg>";
        const svg1000 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><rect x='5' y='5' width='190' height='90' rx='10' fill='%23bbdefb' stroke='%231e88e5' stroke-width='4'/><text x='100' y='65' font-size='45' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%231565c0'>1000</text></svg>";

        const moneyBank = [
            { img: svg1, value: 1, text: "1 元" },
            { img: svg5, value: 5, text: "5 元" },
            { img: svg10, value: 10, text: "10 元" },
            { img: svg50, value: 50, text: "50 元" },
            { img: svg100, value: 100, text: "100 元" },
            { img: svg500, value: 500, text: "500 元" },
            { img: svg1000, value: 1000, text: "1000 元" }
        ];

        // 購物車商品清單 (視覺化)
        const shopItems = ["🍎", "🍔", "🧸", "🚗", "👟", "📚", "🍰", "🧃", "🍫", "🍩"];

        let currentMoney = null;
        let shoppingExpectedChange = 0;
        let currentMode = 1;

        const mode1Container = document.getElementById('mode1-container');
        const mode2Container = document.getElementById('shopping-display');
        const feedbackOverlay = document.getElementById('feedback-overlay');

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode1').classList.toggle('active', mode === 1);
            document.getElementById('btn-mode2').classList.toggle('active', mode === 2);
            
            if (mode === 1) {
                mode1Container.style.display = 'flex';
                mode2Container.style.display = 'none';
                loadMoneyQuestion();
            } else {
                mode1Container.style.display = 'none';
                mode2Container.style.display = 'flex';
                loadShoppingQuestion();
            }
        }

        // --- 模式一邏輯 ---
        function loadMoneyQuestion() {
            currentMoney = moneyBank[Math.floor(Math.random() * moneyBank.length)];
            
            document.getElementById('money-display').innerHTML = `<img src="${currentMoney.img}" class="money-img">`;
            
            let options = [currentMoney];
            while (options.length < 4) {
                let randomOpt = moneyBank[Math.floor(Math.random() * moneyBank.length)];
                if (!options.includes(randomOpt)) options.push(randomOpt);
            }
            options.sort(() => Math.random() - 0.5);

            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkMoneyAnswer(opt.value, btn);
                optionsArea.appendChild(btn);
            });
        }

        function checkMoneyAnswer(selectedValue, btnElement) {
            if (selectedValue === currentMoney.value) {
                showSuccess();
                setTimeout(loadMoneyQuestion, 1500);
            } else {
                btnElement.classList.add('shake');
                btnElement.style.borderColor = "#e53935";
                btnElement.style.backgroundColor = "#ffcdd2";
                setTimeout(() => {
                    btnElement.classList.remove('shake');
                    btnElement.style.borderColor = "#81c784";
                    btnElement.style.backgroundColor = "#e8f5e9";
                }, 400);
            }
        }

        // --- 模式二邏輯 (視覺化算式面板) ---
        function loadShoppingQuestion() {
            // 決定要付多少錢 (只選 10, 50, 100, 500, 1000 的其中一個)
            const paymentsData = moneyBank.filter(m => m.value >= 10);
            let payData = paymentsData[Math.floor(Math.random() * paymentsData.length)]; 
            
            // 價格比付款少
            let price = Math.floor(Math.random() * (payData.value - 1)) + 1; 
            shoppingExpectedChange = payData.value - price;

            // 隨機選一個商品圖示
            let randomEmoji = shopItems[Math.floor(Math.random() * shopItems.length)];

            // 更新算式版：被減數 (給老闆的錢)
            document.getElementById('shop-pay-img').src = payData.img;
            document.getElementById('shop-pay-text').innerText = `${payData.value} 元`;

            // 更新算式版：減數 (商品)
            document.getElementById('shop-item-icon').innerText = randomEmoji;
            document.getElementById('shop-item-price').innerText = price;

            // 更新下方文字雙重提示
            document.getElementById('formula-hint').innerText = `💡 算式小提示： ${payData.value} - ${price} = ?`;

            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
        }

        function checkShoppingAnswer() {
            const playerInput = parseInt(document.getElementById('answer-input').value);
            if (playerInput === shoppingExpectedChange) {
                showSuccess();
                setTimeout(loadShoppingQuestion, 1500);
            } else {
                const inputEl = document.getElementById('answer-input');
                inputEl.classList.add('shake');
                setTimeout(() => {
                    inputEl.classList.remove('shake');
                    inputEl.value = '';
                    inputEl.focus();
                }, 400);
            }
        }

        function showSuccess() {
            feedbackOverlay.style.display = 'flex';
            feedbackOverlay.innerHTML = '<div>✅</div><div style="font-size: 3rem;">答對了！</div>';
            setTimeout(() => { feedbackOverlay.style.display = 'none'; }, 1500);
        }

        // ==========================================
        // 簡易計算機邏輯
        // ==========================================
        let calcString = "";
        const calcScreen = document.getElementById('calc-screen');

        function calcInput(val) {
            if (val === 'C') {
                calcString = ""; calcScreen.value = "0";
            } else if (val === '=') {
                try {
                    let evalString = calcString.replace(/×/g, '*').replace(/÷/g, '/');
                    let result = eval(evalString);
                    calcString = result.toString();
                    calcScreen.value = calcString;
                } catch (e) {
                    calcScreen.value = "錯誤"; calcString = "";
                }
            } else {
                calcString += val; calcScreen.value = calcString;
            }
        }

        // 啟動初始化
        loadMoneyQuestion();
    </script>
</body>
</html>
